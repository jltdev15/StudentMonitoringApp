name: Teacher portal

on:
  push:
    paths: ['teacher-portal/**', 'firebase.json', '.github/workflows/teacher-portal.yml']
  pull_request:
    paths: ['teacher-portal/**', 'firebase.json', '.github/workflows/teacher-portal.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teacher-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: teacher-portal/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
